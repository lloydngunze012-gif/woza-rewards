<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Woza · Lender View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0E0A1F;
      --card: #1A1033;
      --primary: #6D28D9;
      --light: #C4B5FD;
      --gold: #C9961F;
      --text: #FFFFFF;
      --muted: #A99FC2;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .sub { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
    .grid {
      display: grid;
      gap: 16px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .panel {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(196, 181, 253, 0.12);
    }
    .panel h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--light); }
    .panel.before h2 { color: var(--muted); }
    ul { list-style: none; }
    li {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 0.95rem;
    }
    li:last-child { border-bottom: none; }
    .after-stat {
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .highlight { color: var(--gold); font-weight: 600; }
    .btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .confirm {
      margin-top: 12px;
      padding: 14px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22C55E;
      border-radius: 12px;
      display: none;
    }
    .confirm.show { display: block; }
    a.back {
      display: inline-block;
      margin-top: 24px;
      color: var(--light);
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lender view</h1>
    <p class="sub">Synthetic bureau extract for demo underwriting</p>
    <div class="grid" id="content">
      <p style="color:var(--muted)">Loading…</p>
    </div>
    <a class="back" href="/">← Back to Woza app</a>
  </div>
  <script>
    async function load() {
      const res = await fetch("/api/lender_view");
      const data = await res.json();
      const a = data.after || {};
      document.getElementById("content").innerHTML = `
        <div class="panel before">
          <h2>${data.before.headline}</h2>
          <ul>${(data.before.points || []).map(p => `<li>${p}</li>`).join("")}</ul>
        </div>
        <div class="panel">
          <h2>${data.after.headline}</h2>
          <p class="after-stat"><span class="highlight">${a.on_time_months || 36}</span> on-time months across <span class="highlight">${a.bill_count || 3}</span> bills</p>
          <p class="after-stat">${a.monthly_display || "R9 200"}/month · ${a.status || "Gold"} tier</p>
          <p class="after-stat">Woza score <span class="highlight">${a.score || 742}</span> · ${a.grace_unused ?? 2} grace months unused</p>
          <p class="after-stat" style="color:var(--muted);font-size:0.9rem;margin-top:12px">${a.summary || ""}</p>
          <button type="button" class="btn" id="fundBtn">Fund</button>
          <div class="confirm" id="confirm">Application flagged for fast-track review. Thandi Mokoena · Gold · synthetic demo only.</div>
        </div>`;
      document.getElementById("fundBtn").addEventListener("click", () => {
        document.getElementById("confirm").classList.add("show");
        document.getElementById("fundBtn").disabled = true;
        document.getElementById("fundBtn").textContent = "Submitted";
      });
    }
    load();
  </script>
</body>
</html>
