<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6D28D9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Woza Rewards</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0E0A1F;
      --card: #1A1033;
      --primary: #6D28D9;
      --primary-dim: #5B21B6;
      --light: #C4B5FD;
      --gold: #C9961F;
      --green: #22C55E;
      --text: #FFFFFF;
      --muted: #A99FC2;
      --radius: 17px;
      --nav-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .phone {
      max-width: 390px;
      min-height: 100%;
      margin: 0 auto;
      position: relative;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
    }
    @media (min-width: 420px) {
      body { background: #070510; }
      .phone { box-shadow: 0 0 0 1px rgba(255,255,255,0.06); min-height: 100vh; }
    }
    .hidden { display: none !important; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .screen { padding: 16px 16px 8px; }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 24px;
      max-width: 390px;
      margin: 0 auto;
    }
    .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-mark {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #7C3AED, #4C1D95);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.6rem;
    }
    .logo-text h1 { font-size: 1.35rem; font-weight: 700; }
    .logo-text p { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    .login-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(196,181,253,0.1);
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    input[type=tel] {
      width: 100%; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(196,181,253,0.2);
      background: var(--bg); color: var(--text); font-size: 1rem;
      font-family: inherit;
    }
    .btn-primary {
      width: 100%; margin-top: 16px; padding: 14px;
      background: var(--primary); color: #fff; border-radius: 14px;
      font-weight: 600; font-size: 1rem;
    }
    .btn-primary:active { background: var(--primary-dim); }
    .btn-secondary {
      width: 100%; margin-top: 10px; padding: 14px;
      border: 1px solid var(--primary); color: var(--light);
      border-radius: 14px; font-weight: 600;
    }
    .err { color: #f87171; font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }

    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #7C3AED, #4C1D95);
      display: flex; align-items: center; justify-content: center; font-weight: 800;
    }
    .brand small { display: block; color: var(--muted); font-size: 0.72rem; }
    .brand strong { font-size: 0.95rem; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--primary); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.95rem;
    }
    .greeting { font-size: 1.15rem; font-weight: 600; margin-bottom: 14px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(196,181,253,0.08);
    }
    .card.hero {
      background: linear-gradient(145deg, #2E1065 0%, #1A1033 55%);
      border-color: rgba(196,181,253,0.15);
    }
    .card-label { color: var(--muted); font-size: 0.82rem; }
    .big-num { font-size: 2rem; font-weight: 700; margin: 4px 0 10px; letter-spacing: -0.02em; }
    .row-split { display: flex; gap: 12px; }
    .row-split > div { flex: 1; }
    .mini-label { font-size: 0.75rem; color: var(--muted); }
    .mini-val { font-size: 0.95rem; font-weight: 600; margin-top: 2px; }
    .status-line { font-size: 0.82rem; color: var(--light); margin-bottom: 8px; }
    .progress {
      height: 8px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden;
    }
    .progress > span {
      display: block; height: 100%; background: var(--primary); border-radius: 99px;
      transition: width 0.3s ease;
    }
    .progress-caption { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }

    .score-card { display: flex; gap: 14px; align-items: center; }
    .ring {
      width: 72px; height: 72px; border-radius: 50%;
      border: 4px solid var(--primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ring strong { font-size: 1.2rem; line-height: 1; }
    .ring em { font-style: normal; font-size: 0.65rem; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      font-size: 0.72rem; padding: 6px 10px; border-radius: 99px;
      background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.35);
    }
    .section-title { font-size: 0.95rem; font-weight: 600; margin: 8px 0 10px; }
    .bill-tiles { display: grid; gap: 10px; }
    .tile {
      background: var(--card); border-radius: 14px; padding: 14px;
      border: 1px solid rgba(196,181,253,0.08);
    }
    .tile-top { display: flex; justify-content: space-between; font-weight: 600; }
    .tile-due { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }

    .page-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 16px; }
    .due-banner .earn { color: var(--light); font-size: 0.88rem; margin-top: 6px; }
    .payday-row {
      font-size: 0.82rem; color: var(--muted); margin: 12px 0;
      padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: 12px;
    }
    .pay-row {
      background: #fff; color: #1A1033; border-radius: var(--radius);
      padding: 14px; margin-bottom: 10px; display: grid;
      grid-template-columns: 44px 1fr auto; gap: 10px; align-items: start;
    }
    .pay-row.paid { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.4); color: var(--text); }
    .pay-row.grace { background: rgba(196,181,253,0.08); border: 1px solid rgba(196,181,253,0.25); color: var(--text); }
    .icon-circle {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .pay-row h3 { font-size: 0.95rem; margin-bottom: 2px; }
    .pay-row .amt { font-weight: 700; font-size: 0.95rem; }
    .pay-meta { font-size: 0.72rem; color: #64748b; margin-top: 4px; line-height: 1.35; }
    .pay-row.paid .pay-meta, .pay-row.grace .pay-meta { color: var(--muted); }
    .earn-line { font-size: 0.75rem; color: var(--primary); margin-top: 6px; font-weight: 600; }
    .pay-row.paid .earn-line { color: var(--green); }
    .btn-pay {
      background: var(--primary); color: #fff; padding: 8px 14px;
      border-radius: 10px; font-size: 0.82rem; font-weight: 600; white-space: nowrap;
    }
    .btn-pay:disabled { opacity: 0.5; }
    .badge-auto {
      background: #E2E8F0; color: #334155; padding: 6px 10px;
      border-radius: 8px; font-size: 0.75rem; font-weight: 600;
    }
    .link-btn {
      color: var(--light); font-size: 0.88rem; text-decoration: underline;
      margin: 12px 0; display: inline-block;
    }
    .stub-row {
      padding: 14px; border-radius: 14px; border: 1px dashed rgba(196,181,253,0.25);
      color: var(--muted); font-size: 0.85rem; text-align: center;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; text-align: center; padding: 10px 8px; border-radius: 99px;
      font-size: 0.82rem; font-weight: 600; color: var(--muted);
      background: rgba(255,255,255,0.04);
    }
    .tab.active { background: var(--primary); color: #fff; }
    .redeem-item {
      display: flex; gap: 12px; align-items: center;
      padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
    }
    .redeem-item:last-child { border-bottom: none; }
    .redeem-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(109,40,217,0.25); display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .redeem-item h4 { font-size: 0.92rem; margin-bottom: 2px; }
    .redeem-item p { font-size: 0.78rem; color: var(--muted); }
    .benefit-line {
      padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.88rem; line-height: 1.45;
    }
    .timeline { margin-top: 8px; }
    .timeline h4 { font-size: 0.88rem; margin-bottom: 6px; }
    .timeline-bar {
      display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 2px; background: var(--primary);
    }

    .profile-card { text-align: center; padding: 24px 16px; }
    .profile-card .avatar { width: 72px; height: 72px; font-size: 1.5rem; margin: 0 auto 12px; }
    .verified { color: var(--green); font-size: 0.88rem; margin-top: 6px; }
    .profile-actions { margin-top: 20px; display: grid; gap: 10px; }
    .profile-actions a, .profile-actions button {
      display: block; width: 100%; padding: 14px; border-radius: 14px;
      text-align: center; text-decoration: none; font-weight: 600;
    }
    .profile-actions a { background: rgba(196,181,253,0.12); color: var(--light); }
    .profile-actions .danger { background: rgba(248,113,113,0.15); color: #fca5a5; border: 1px solid rgba(248,113,113,0.3); }

    .nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 390px;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: #fff; display: flex; align-items: center;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
    }
    .nav button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 0.68rem; color: #94a3b8; padding: 8px 0;
    }
    .nav button.active { color: var(--primary); }
    .nav svg { width: 22px; height: 22px; }

    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 50%; transform: translate(-50%, 100%);
      bottom: 0; width: 100%; max-width: 390px;
      background: var(--card); border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(24px + var(--safe-b));
      z-index: 50; transition: transform 0.25s ease;
      border-top: 1px solid rgba(196,181,253,0.15);
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet h3 { font-size: 1.1rem; margin-bottom: 12px; }
    .sheet input[type=number] {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(196,181,253,0.2);
      background: var(--bg); color: var(--text); font-size: 1rem; font-family: inherit;
    }
    .sheet .computed { margin: 12px 0; color: var(--light); font-weight: 600; }
    .sheet-actions { display: flex; gap: 10px; }
    .sheet-actions button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; }
    .sheet-cancel { background: rgba(255,255,255,0.08); color: var(--muted); }
    .sheet-confirm { background: var(--primary); color: #fff; }
    .grace-option {
      width: 100%; text-align: left; padding: 14px; margin-bottom: 8px;
      background: var(--bg); border-radius: 12px; border: 1px solid rgba(196,181,253,0.15);
    }
    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 0.85rem; z-index: 60; opacity: 0; transition: opacity 0.2s;
      max-width: 340px; text-align: center;
    }
    .toast.show { opacity: 1; }
    .busy { pointer-events: none; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="logo-row">
      <div class="logo-mark">W</div>
      <div class="logo-text">
        <h1>Woza</h1>
        <p>Pay today. Get more tomorrow.</p>
      </div>
    </div>
    <div class="login-card">
      <label for="phone">Mobile number</label>
      <input id="phone" type="tel" placeholder="072 418 3390" autocomplete="tel" />
      <button type="button" class="btn-primary" id="loginBtn">Continue</button>
      <button type="button" class="btn-secondary" id="demoBtn">Try as Thandi</button>
      <p class="err" id="loginErr"></p>
    </div>
  </div>

  <div id="appView" class="phone hidden">
    <div id="screenHome" class="screen"></div>
    <div id="screenPayments" class="screen hidden"></div>
    <div id="screenRewards" class="screen hidden"></div>
    <div id="screenProfile" class="screen hidden"></div>

    <nav class="nav" id="tabNav">
      <button type="button" data-tab="home" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
        Home
      </button>
      <button type="button" data-tab="payments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        Payments
      </button>
      <button type="button" data-tab="rewards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v13M12 8a4 4 0 100-8 4 4 0 000 8zM5 8h14a2 2 0 012 2v1H3v-1a2 2 0 012-2z"/></svg>
        Rewards
      </button>
      <button type="button" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></svg>
        Profile
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet">
    <div id="sheetBody"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const ICONS = { rent: "🏠", utilities: "⚡", car: "🚗" };
    const ICON_BG = { rent: "#6D28D9", utilities: "#8B5CF6", car: "#BE185D" };
    let state = null;
    let busy = false;
    let rewardsTab = "redeem";
    let redeemOption = null;

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2800);
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || res.statusText);
      }
      return res.json();
    }

    async function login(phone) {
      await api("/api/login", { method: "POST", body: JSON.stringify({ phone }) });
      await refresh();
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("appView").classList.remove("hidden");
    }

    async function refresh() {
      state = await api("/api/me");
      renderAll();
    }

    function fmtPts(n) {
      return (n + "").replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " pts";
    }

    function verificationLabel(v) {
      return v === "bank_feed" ? "Verified: Debit order read" : "Verified: Paid through Woza";
    }

    function renderHome() {
      const u = state.user;
      const h = state.home;
      const tp = u.tier_progress;
      const pct = tp.progress_den ? Math.min(100, (tp.progress_num / tp.progress_den) * 100) : 100;
      const earned = h.month_earned_points;
      const displayPts = earned > 0 ? fmtPts(earned) : fmtPts(0);
      const bills = state.payments.bills;
      document.getElementById("screenHome").innerHTML = `
        <header class="app-header">
          <div class="brand">
            <div class="brand-mark">W</div>
            <div><strong>Woza</strong><small>Pay today. Get more tomorrow.</small></div>
          </div>
          <div class="avatar">${u.name.charAt(0)}</div>
        </header>
        <p class="greeting">${h.greeting}</p>
        <div class="card hero">
          <div class="card-label">Your Points</div>
          <div class="big-num">${displayPts.replace(" pts", "")}<span style="font-size:1rem;color:var(--muted)"> pts</span></div>
          <div class="row-split">
            <div><div class="mini-label">Lifetime Points</div><div class="mini-val">${u.lifetime_display.replace(" pts","")}</div></div>
            <div><div class="mini-label">Tier Status</div><div class="mini-val">${u.status}</div></div>
          </div>
        </div>
        <div class="card">
          <div class="status-line">${h.status_line}</div>
          <div class="progress"><span style="width:${pct}%"></span></div>
          <div class="progress-caption">${h.progress_label}</div>
        </div>
        <div class="card score-card">
          <div class="ring"><strong>${u.score}</strong><em>${u.score_label}</em></div>
          <div>
            <div class="card-label">Woza Score</div>
            <p style="font-size:0.85rem;color:var(--muted);margin-top:4px">On-time payments build your score</p>
            <div class="chips">${h.bills_on_track.map(b => `<span class="chip">${b} · On track</span>`).join("")}</div>
          </div>
        </div>
        <p class="section-title">Your Bills</p>
        <div class="bill-tiles">
          ${bills.map(b => `
            <div class="tile">
              <div class="tile-top"><span>${b.name}</span><span>${b.amount_display}</span></div>
              <div class="tile-due">Due ${state.meta.due_display}</div>
            </div>`).join("")}
        </div>`;
    }

    function renderPayments() {
      const p = state.payments;
      const m = state.meta;
      document.getElementById("screenPayments").innerHTML = `
        <h2 class="page-title">Make a Payment</h2>
        <p class="page-sub">Earn points on the essentials.</p>
        <div class="card due-banner">
          <div class="card-label">Total due this month</div>
          <div class="big-num" style="font-size:1.6rem">${p.total_due_display}</div>
          <div class="earn">Earns ${p.earn_if_paid_display} when paid on time</div>
        </div>
        <div class="payday-row">Payday ${m.payday_display} · ${m.payday_multiplier}× pts before payday · ${state.user.grace_months} grace months available</div>
        ${p.bills.map(b => paymentRow(b)).join("")}
        <button type="button" class="btn-primary" id="payAllBtn" style="margin:12px 0 8px">Pay all bills</button>
        <div class="stub-row">Upcoming payments · manage scheduled debits (demo stub)</div>
        <button type="button" class="link-btn" id="graceLink">Use a grace month</button>`;
      document.getElementById("payAllBtn").onclick = () => actionPayAll();
      document.getElementById("graceLink").onclick = openGraceSheet;
      p.bills.forEach(b => {
        const btn = document.getElementById("pay-" + b.id);
        if (btn) btn.onclick = () => actionPay(b.id);
      });
    }

    function paymentRow(b) {
      const cls = b.paid ? "paid" : b.grace_used ? "grace" : "";
      const verify = verificationLabel(b.verification);
      let right = b.is_auto
        ? `<span class="badge-auto">Auto</span>`
        : `<button type="button" class="btn-pay" id="pay-${b.id}" ${b.paid || b.grace_used ? "disabled" : ""}>Pay</button>`;
      if (b.is_auto && !b.paid && !b.grace_used) {
        right = `<button type="button" class="btn-pay" id="pay-${b.id}">Sync</button>`;
      }
      const earn = b.paid ? b.status_line : `Earns ${fmtPts(b.potential_points)}`;
      return `
        <div class="pay-row ${cls}">
          <div class="icon-circle" style="background:${ICON_BG[b.category] || "#6D28D9"}22;color:${ICON_BG[b.category]}">${ICONS[b.category] || "💳"}</div>
          <div>
            <h3>${b.name}</h3>
            <div class="amt">${b.amount_display}</div>
            <div class="pay-meta">${verify}<br/>Due ${state.meta.due_display}</div>
            <div class="earn-line">${earn}</div>
          </div>
          <div>${right}</div>
        </div>`;
    }

    function renderRewards() {
      const u = state.user;
      const r = state.rewards;
      document.getElementById("screenRewards").innerHTML = `
        <h2 class="page-title">Your Rewards</h2>
        <div class="card hero">
          <div class="card-label">Total Points</div>
          <div class="big-num">${u.points_display.replace(" pts","")}<span style="font-size:1rem;color:var(--muted)"> pts</span></div>
          <div class="row-split">
            <div><div class="mini-label">Tier Status</div><div class="mini-val">${u.status}</div></div>
            <div><div class="mini-label">Lifetime Points</div><div class="mini-val">${u.lifetime_display.replace(" pts","")}</div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-label">Woza Cash</div>
          <div class="big-num" style="font-size:1.4rem">${u.woza_cash_display}</div>
          <p style="font-size:0.82rem;color:var(--muted);margin-top:6px">Use for future bill payments</p>
        </div>
        <div class="tabs">
          <button type="button" class="tab ${rewardsTab==="redeem"?"active":""}" data-rtab="redeem">Redeem</button>
          <button type="button" class="tab ${rewardsTab==="benefits"?"active":""}" data-rtab="benefits">Benefits</button>
          <button type="button" class="tab ${rewardsTab==="progress"?"active":""}" data-rtab="progress">Your Progress</button>
        </div>
        <div id="rewardsPanel"></div>`;
      document.querySelectorAll("[data-rtab]").forEach(btn => {
        btn.onclick = () => { rewardsTab = btn.dataset.rtab; renderRewards(); renderRewardsPanel(); };
      });
      renderRewardsPanel();
    }

    function renderRewardsPanel() {
      const r = state.rewards;
      const panel = document.getElementById("rewardsPanel");
      if (!panel) return;
      if (rewardsTab === "redeem") {
        const icons = { rent: "🏠", ebucks: "🎁", airtime: "📱", cash: "🏦" };
        panel.innerHTML = `<div class="card">${r.redemption_options.map(o => `
          <div class="redeem-item" data-opt="${o.id}">
            <div class="redeem-icon">${icons[o.id] || "✨"}</div>
            <div>
              <h4>${o.title}</h4>
              <p>${o.rate} · ${o.example}</p>
            </div>
          </div>`).join("")}</div>`;
        panel.querySelectorAll(".redeem-item").forEach(el => {
          el.onclick = () => openRedeemSheet(el.dataset.opt);
        });
      } else if (rewardsTab === "benefits") {
        const b = r.benefits;
        panel.innerHTML = `<div class="card">
          <div class="benefit-line"><strong>${b.grace_months} grace months</strong> available when life happens.</div>
          <div class="benefit-line"><strong>${b.tier} rate</strong> at partner lenders.</div>
          <div class="benefit-line">Your record at the bureau: Rent ${b.bureau.rent_months} months reported, Utilities ${b.bureau.utilities_months}, ${b.bureau.car_note}.</div>
        </div>`;
      } else {
        panel.innerHTML = `<div class="card timeline">${r.progress.map(p => `
          <h4>${p.bill_name} · ${p.months_on_time} months on time</h4>
          <div class="timeline-bar">${p.periods.map(() => `<span class="dot"></span>`).join("")}</div>`).join("")}</div>`;
      }
    }

    function renderProfile() {
      const u = state.user;
      document.getElementById("screenProfile").innerHTML = `
        <h2 class="page-title">Profile</h2>
        <div class="card profile-card">
          <div class="avatar">${u.name.charAt(0)}</div>
          <h3>${u.name}</h3>
          <p style="color:var(--muted);margin-top:6px">${u.phone}</p>
          <p class="verified">It's you · verified</p>
          <div class="profile-actions">
            <a href="/lender">Lender view (demo bureau)</a>
            <button type="button" class="danger" id="resetBtn">Reset demo</button>
          </div>
        </div>`;
      document.getElementById("resetBtn").onclick = actionReset;
    }

    function renderAll() {
      renderHome();
      renderPayments();
      renderRewards();
      renderProfile();
    }

    function showTab(name) {
      ["Home","Payments","Rewards","Profile"].forEach((s, i) => {
        const key = ["home","payments","rewards","profile"][i];
        document.getElementById("screen" + s).classList.toggle("hidden", key !== name);
      });
      document.querySelectorAll("#tabNav button").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === name);
      });
    }

    async function withBusy(fn) {
      if (busy) return;
      busy = true;
      document.getElementById("appView").classList.add("busy");
      try {
        await fn();
      } catch (e) {
        toast(e.message || "Something went wrong");
      } finally {
        busy = false;
        document.getElementById("appView").classList.remove("busy");
      }
    }

    function actionPay(id) {
      withBusy(async () => {
        state = await api("/api/pay", { method: "POST", body: JSON.stringify({ bill_id: id }) });
        renderAll();
        toast("Payment recorded");
      });
    }

    function actionPayAll() {
      withBusy(async () => {
        state = await api("/api/pay_all", { method: "POST", body: JSON.stringify({}) });
        renderAll();
        toast("All bills paid");
      });
    }

    function actionReset() {
      withBusy(async () => {
        state = await api("/api/reset", { method: "POST", body: JSON.stringify({}) });
        rewardsTab = "redeem";
        renderAll();
        toast("Demo reset");
      });
    }

    function closeSheet() {
      document.getElementById("sheet").classList.remove("open");
      document.getElementById("sheetBackdrop").classList.remove("open");
    }

    function openGraceSheet() {
      const bills = state.payments.bills.filter(b => !b.paid && !b.grace_used);
      document.getElementById("sheetBody").innerHTML = `
        <h3>Use a grace month</h3>
        <p style="color:var(--muted);font-size:0.88rem;margin-bottom:12px">${state.user.grace_months} remaining · streak held, no points this month</p>
        ${bills.length ? bills.map(b => `
          <button type="button" class="grace-option" data-gid="${b.id}">${b.name} · ${b.amount_display}</button>`).join("") : `<p>No unpaid bills eligible.</p>`}
        <button type="button" class="sheet-cancel" style="width:100%;margin-top:8px;padding:12px;border-radius:12px" id="graceCancel">Cancel</button>`;
      document.getElementById("sheet").classList.add("open");
      document.getElementById("sheetBackdrop").classList.add("open");
      document.getElementById("graceCancel").onclick = closeSheet;
      document.querySelectorAll("[data-gid]").forEach(btn => {
        btn.onclick = () => withBusy(async () => {
          state = await api("/api/grace", { method: "POST", body: JSON.stringify({ bill_id: +btn.dataset.gid }) });
          closeSheet();
          renderAll();
          toast("Grace month applied");
        });
      });
    }

    const RATES = { rent: 1.5, ebucks: 1, airtime: 1, cash: 0.5 };

    function openRedeemSheet(opt) {
      redeemOption = opt;
      const title = state.rewards.redemption_options.find(o => o.id === opt)?.title || opt;
      document.getElementById("sheetBody").innerHTML = `
        <h3>${title}</h3>
        <label class="card-label" for="ptsIn">Points to redeem</label>
        <input type="number" id="ptsIn" min="1000" step="1000" value="10000" />
        <div class="computed" id="valOut"></div>
        <div class="sheet-actions">
          <button type="button" class="sheet-cancel" id="redeemCancel">Cancel</button>
          <button type="button" class="sheet-confirm" id="redeemConfirm">Confirm</button>
        </div>`;
      const upd = () => {
        const pts = +document.getElementById("ptsIn").value || 0;
        const cents = Math.floor(pts * RATES[opt]);
        const rands = (cents / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        document.getElementById("valOut").textContent = `Value: R${rands}`;
      };
      document.getElementById("ptsIn").oninput = upd;
      upd();
      document.getElementById("sheet").classList.add("open");
      document.getElementById("sheetBackdrop").classList.add("open");
      document.getElementById("redeemCancel").onclick = closeSheet;
      document.getElementById("redeemConfirm").onclick = () => withBusy(async () => {
        const points = +document.getElementById("ptsIn").value;
        state = await api("/api/redeem", { method: "POST", body: JSON.stringify({ option: opt, points }) });
        closeSheet();
        renderAll();
        toast("Redemption confirmed");
      });
    }

    document.getElementById("sheetBackdrop").onclick = closeSheet;
    document.getElementById("tabNav").addEventListener("click", e => {
      const btn = e.target.closest("button[data-tab]");
      if (btn) showTab(btn.dataset.tab);
    });

    document.getElementById("loginBtn").onclick = () => withBusy(async () => {
      const phone = document.getElementById("phone").value.trim() || "072 418 3390";
      document.getElementById("loginErr").textContent = "";
      try {
        await login(phone);
      } catch (e) {
        document.getElementById("loginErr").textContent = "Login failed";
      }
    });
    document.getElementById("demoBtn").onclick = () => withBusy(async () => {
      document.getElementById("phone").value = "072 418 3390";
      document.getElementById("loginErr").textContent = "";
      await login("072 418 3390");
    });

    async function boot() {
      try {
        state = await api("/api/me");
        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("appView").classList.remove("hidden");
        renderAll();
      } catch {
        /* show login */
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js").catch(() => {});
    }
    boot();
  </script>
</body>
</html>
