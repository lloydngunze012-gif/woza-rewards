  <style>
    :root {
      --bg: #F6F4FB;
      --surface: #FFFFFF;
      --ink: #1C1530;
      --muted: #565070;
      --line: #E9E4F5;
      --primary: #5B2BD9;
      --primary-soft: #EEE8FD;
      --hero-from: #2A1458;
      --hero-to: #4A1FA8;
      --gold: #C9A24A;
      --verified: #1F9D63;
      --nav-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --t-fast: 150ms;
      --t-base: 400ms;
      --t-slow: 900ms;
      --t-press: 80ms;
      --t-release: 260ms;
      --t-ripple: 450ms;
      --t-flip: 600ms;
      --t-sweep: 700ms;
      --t-score: 600ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    .font-num { font-family: "Sora", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
    .phone {
      max-width: 390px; min-height: 100%; margin: 0 auto; position: relative;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
    }
    .hidden { display: none !important; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .screen { padding: 20px 20px 8px; }
    .section { margin-bottom: 24px; }
    .login-wrap {
      min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
      padding: 32px 20px; max-width: 390px; margin: 0 auto;
    }
    .login-card {
      background: var(--surface); border-radius: 16px; padding: 20px;
      border: 1px solid var(--line);
    }
    label { display: block; font-size: 0.875rem; color: var(--muted); margin-bottom: 8px; }
    input[type=tel], input[type=number], input[type=text] {
      width: 100%; padding: 14px 16px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      font-size: 1rem; font-family: inherit;
    }
    .login-brand { text-align: center; margin-bottom: 8px; }
    .login-mark {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 0 0 4px var(--primary-soft);
    }
    .login-mark span {
      font-family: "Sora", sans-serif; font-weight: 700; font-size: 2rem; line-height: 1;
    }
    .login-wordmark {
      font-family: "Sora", sans-serif; font-weight: 700; font-size: 1.6rem;
    }
    .login-slogan { text-align: center; }
    .btn-primary {
      width: 100%; height: 52px; margin-top: 12px;
      background: var(--primary); color: #fff; border-radius: 14px;
      font-weight: 600; font-size: 1rem;
    }
    .btn-primary:disabled { opacity: 0.45; pointer-events: none; }
    .btn-primary:active, .btn-primary.is-press { background: #5428C8; }
    .btn-secondary {
      width: 100%; height: 52px; margin-top: 10px;
      background: var(--primary-soft); color: var(--primary);
      border-radius: 14px; font-weight: 600;
    }
    .btn-row-pay {
      width: auto; min-width: 72px; height: 52px; margin-top: 0;
      padding: 0 16px; font-size: 0.88rem; white-space: nowrap;
    }
    .err { color: #dc2626; font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }

    .home-brand { margin-bottom: 16px; }
    .home-wordmark { font-family: "Sora", sans-serif; font-weight: 700; font-size: 1.35rem; color: var(--ink); }
    .home-tagline { font-size: 0.875rem; color: var(--muted); margin-top: 4px; }
    .home-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .home-head .page-title { flex: 1; min-width: 0; }
    .home-gear {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
    }
    .home-gear svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; }
    .home-status {
      color: var(--verified); font-weight: 600; font-size: 0.88rem;
      text-align: center; margin-top: 12px; line-height: 1.35;
    }
    .home-status.is-nudge {
      color: var(--gold); width: 100%; background: none; border: none;
      padding: 8px 0; min-height: 44px; font: inherit; font-weight: 600; font-size: 0.88rem;
    }
    .streak-dots {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
      gap: 6px; margin-top: 4px; font-size: 0.78rem; font-weight: 600;
    }
    .streak-dot-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .streak-pip {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--primary-soft); background: var(--surface); box-sizing: border-box;
    }
    .streak-dot-item.reached .streak-pip {
      background: var(--primary); border-color: var(--primary);
    }
    .streak-sep { color: var(--muted); font-weight: 500; }
    .month-bills {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      margin: 12px 0;
    }
    .month-bill { text-align: center; min-width: 0; }
    .month-bill .icon-wrap { margin: 0 auto 6px; }
    .month-bill .row-title { font-size: 0.82rem; }
    .month-bill .font-num { font-size: 0.88rem; margin-top: 2px; }
    .login-or {
      text-align: center; color: var(--muted); font-size: 0.82rem;
      margin: 16px 0 8px;
    }
    .rewards-pts { font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.045em; }
    .rewards-worth { margin-top: 4px; }
    .rewards-cash { margin-top: 8px; font-size: 0.78rem; }
    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cat-tile {
      display: block; width: 100%; text-align: left;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 0; overflow: hidden;
    }
    .cat-photo {
      display: block; position: relative;
      width: 100%; aspect-ratio: 4 / 3;
      background-color: #3A2468;
      background-size: cover; background-position: center;
    }
    .cat-photo::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(28, 21, 48, 0.92) 0%, rgba(28, 21, 48, 0.55) 40%, rgba(28, 21, 48, 0.12) 68%, transparent 82%);
    }
    .cat-copy {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      padding: 12px 12px 11px;
    }
    .cat-tile .row-title {
      display: block; font-weight: 700; font-size: 0.88rem; color: #fff;
      line-height: 1.2; text-shadow: 0 1px 8px rgba(28, 21, 48, 0.45);
    }
    .cat-tile .row-sub {
      display: block; font-weight: 500; font-size: 0.7rem; color: #fff; opacity: 0.95;
      line-height: 1.25; text-shadow: 0 1px 6px rgba(28, 21, 48, 0.4);
    }
    .reward-carousel {
      display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
      padding: 4px 2px 10px; margin: 0 -4px;
    }
    .reward-card {
      flex: 0 0 78%; scroll-snap-align: start;
      background: var(--bg); border: 1px solid var(--line); border-radius: 16px;
      padding: 14px;
    }
    .reward-photo {
      height: 88px; border-radius: 12px; margin-bottom: 10px;
      background-color: #3A2468;
      background-size: cover; background-position: center;
    }
    .reward-cost { font-size: 0.78rem; color: var(--muted); margin: 6px 0 10px; }
    .voucher-banner {
      position: relative;
      background:
        repeating-linear-gradient(-18deg, transparent, transparent 11px, rgba(255,255,255,0.05) 11px, rgba(255,255,255,0.05) 12px),
        linear-gradient(145deg, #E11D48 0%, #BE123C 58%, #9F1239 100%);
      color: #fff;
      border-radius: 16px;
      padding: 16px 18px 14px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(159, 18, 57, 0.22);
    }
    .voucher-banner::before,
    .voucher-banner::after {
      content: "";
      position: absolute;
      top: 26px;
      width: 18px;
      height: 18px;
      background: var(--bg);
      border-radius: 50%;
    }
    .voucher-banner::before { left: -9px; }
    .voucher-banner::after { right: -9px; }
    .voucher-banner-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .voucher-banner h3 {
      font-family: "Sora", sans-serif; font-weight: 700; font-size: 1.05rem;
      letter-spacing: -0.02em; margin: 0; color: #fff;
    }
    .voucher-stamp {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.16);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22);
    }
    .voucher-stamp svg {
      width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2;
    }
    .voucher-count {
      min-width: 28px; height: 28px; padding: 0 8px; border-radius: 99px;
      display: grid; place-items: center;
      background: #FFF7F2; color: #9F1239;
      font-family: "Sora", sans-serif; font-weight: 700; font-size: 0.82rem;
    }
    .voucher-dash {
      border: 0; height: 0;
      border-top: 1.5px dashed rgba(255,255,255,0.38);
      margin: 12px 4px 12px;
    }
    .voucher-empty {
      border: 1.5px dashed rgba(255,255,255,0.45);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      font-size: 0.82rem;
      line-height: 1.35;
      color: rgba(255,255,255,0.92);
      background: rgba(255,255,255,0.08);
    }
    .voucher-row {
      background: #FFF7F2;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 8px;
    }
    .voucher-row:first-of-type { margin-top: 0; }
    .voucher-row .row-title { color: var(--ink); font-weight: 700; }
    .voucher-row .row-sub { color: #7A3A3A; }
    .voucher-row .voucher-code {
      font-family: "Sora", sans-serif; font-weight: 700; font-size: 0.92rem;
      letter-spacing: 0.08em; color: #9F1239; margin-top: 4px;
    }
    .gold-perks { font-size: 0.82rem; line-height: 1.4; }
    .forecast-hero { text-align: center; padding: 20px 16px 16px; }
    .forecast-ring {
      width: 148px; height: 148px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0 auto 12px; position: relative;
    }
    .forecast-ring svg { position: absolute; inset: 0; width: 148px; height: 148px; }
    .forecast-ring .score-track, .forecast-ring .score-fill { stroke-width: 8; }
    .forecast-ring .score-fill {
      stroke-dasharray: 389.56; stroke-dashoffset: var(--forecast-offset, 23.37);
      transform: rotate(-90deg); transform-origin: 74px 74px;
    }
    .forecast-ring-text { position: relative; z-index: 1; text-align: center; }
    .forecast-ring strong { font-family: "Sora", sans-serif; font-size: 2rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; line-height: 1; }
    .forecast-ring em { font-style: normal; font-size: 0.72rem; color: var(--muted); display: block; margin-top: 4px; }
    .forecast-hero-line { font-family: "Sora", sans-serif; font-weight: 600; font-size: 1.02rem; margin-top: 4px; }
    .forecast-status { text-align: center; font-size: 0.92rem; font-weight: 600; margin: -8px 0 16px; }
    .forecast-bill .row-title { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .forecast-pct { font-family: "Sora", sans-serif; font-weight: 700; color: var(--primary); white-space: nowrap; letter-spacing: -0.045em; }
    .forecast-disclosure { font-size: 0.72rem; color: var(--muted); line-height: 1.4; margin-top: 8px; margin-bottom: 20px; text-align: center; }

    .debit-label { font-size: 0.72rem; color: var(--muted); margin-top: 3px; font-weight: 500; line-height: 1.35; word-break: break-word; }

    .panel {
      background: var(--surface); border-radius: 16px; border: 1px solid var(--line);
      padding: 16px; margin-bottom: 24px;
    }
    .panel h3 { font-family: "Sora", sans-serif; font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
    .muted, .row-sub, .gold-perks, .home-status, .page-sub, .forecast-disclosure, .debit-label, .rewards-worth, .rewards-cash {
      text-wrap: pretty;
    }
    .muted { color: var(--muted); font-size: 0.875rem; line-height: 1.45; }
    .tier-ladder { margin-top: 4px; max-width: 100%; overflow: hidden; }
    .tier-ladder-rail {
      position: relative; height: 52px; margin: 0 7px 6px;
    }
    .tier-ladder-track {
      position: absolute; left: 0; right: 0; top: 18px; height: 6px;
      background: var(--primary-soft); border-radius: 99px;
    }
    .tier-ladder-fill {
      position: absolute; left: 0; right: 0; top: 18px; height: 6px;
      background: var(--primary); border-radius: 99px;
      transform: scaleX(var(--fill-to, 0.75));
      transform-origin: left center;
    }
    .tier-stop {
      position: absolute; top: 8px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; z-index: 2;
    }
    .tier-dot {
      width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; line-height: 1; box-sizing: border-box;
    }
    .tier-stop.reached .tier-dot {
      background: var(--primary); color: #fff; border: 2px solid var(--primary);
    }
    .tier-stop.gold.reached .tier-dot {
      box-shadow: 0 0 0 2px var(--gold);
    }
    .tier-stop.black:not(.reached) .tier-dot {
      background: var(--surface); border: 2px solid var(--primary-soft); color: transparent;
    }
    .tier-you {
      position: absolute; top: 0; transform: translateX(-50%); z-index: 3;
      font-size: 0.62rem; font-weight: 600; color: var(--ink); white-space: nowrap;
      background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 5px;
    }
    .tier-you::after {
      content: ""; position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%);
      border: 4px solid transparent; border-top-color: var(--line);
    }
    .tier-ladder-labels {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
      text-align: center; font-size: 0.72rem; font-weight: 600; color: var(--ink);
      white-space: nowrap;
    }
    .tier-ladder-subs {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
      text-align: center; font-size: 0.62rem; color: var(--muted); margin-top: 2px;
      white-space: nowrap;
    }
    .tier-ladder-caption {
      margin-top: 10px; font-size: 0.72rem; font-weight: 500; color: var(--muted);
      text-align: center;
    }
    .row-value { font-weight: 700; font-size: 0.92rem; margin-top: 2px; line-height: 1.35; word-break: break-word; }
    .row-rate { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .score-row { display: flex; gap: 14px; align-items: center; }
    .score-ring {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;
      position: relative;
    }
    .score-ring svg { position: absolute; inset: 0; width: 64px; height: 64px; }
    .score-track { fill: none; stroke: var(--primary-soft); stroke-width: 4; }
    .score-fill {
      fill: none; stroke: var(--primary); stroke-width: 4; stroke-linecap: round;
      stroke-dasharray: 169.65; stroke-dashoffset: var(--score-offset, 21.54);
      transform: rotate(-90deg); transform-origin: 32px 32px;
    }
    .score-ring-text { position: relative; z-index: 1; text-align: center; }
    .score-ring strong { font-family: "Sora", sans-serif; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .score-ring em { font-style: normal; font-size: 0.65rem; color: var(--muted); display: block; }

    .group-list { background: var(--surface); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
    .group-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left;
      box-sizing: border-box; max-width: 100%;
    }
    .group-row .icon-wrap { flex-shrink: 0; }
    .group-row .row-text { flex: 1; min-width: 0; }
    .group-row .row-action { flex-shrink: 0; align-self: center; }
    .group-row:last-child { border-bottom: none; }
    .icon-wrap {
      width: 40px; height: 40px; border-radius: 12px; background: var(--primary-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .icon-wrap svg { width: 20px; height: 20px; stroke: var(--primary); fill: none; stroke-width: 2; }
    .row-title { font-weight: 600; font-size: 0.92rem; }
    .row-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; line-height: 1.35; word-break: break-word; }
    .row-was { text-decoration: line-through; color: var(--muted); margin-right: 6px; }
    .row-now { color: var(--verified); font-weight: 600; }
    .row-points { font-size: 0.78rem; color: var(--primary); font-weight: 600; margin-top: 4px; line-height: 1.35; word-break: break-word; }
    .bureau-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; font-size: 0.82rem; color: var(--muted); }
    .bureau-row.section { margin-top: 0; margin-bottom: 16px; }
    .bureau-row svg { width: 18px; height: 18px; stroke: var(--primary); flex-shrink: 0; margin-top: 1px; }
    .page-title, .page-sub { padding-left: 0; margin-left: 0; }
    .chevron { width: 20px; height: 20px; stroke: var(--muted); flex-shrink: 0; }
    .avatar-init {
      width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 50%;
      background: var(--primary-soft); color: var(--primary);
      font-family: "Sora", sans-serif; font-weight: 700; font-size: 1.25rem;
      display: flex; align-items: center; justify-content: center;
    }
    .linked-row {
      width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line);
      display: block;
    }
    .badge-unverified { background: #FEE2E2; color: #B91C1C; }
    .badge {
      font-size: 0.72rem; font-weight: 600; padding: 5px 8px; border-radius: 8px;
      white-space: nowrap;
    }
    .badge-due { background: var(--primary-soft); color: var(--primary); }
    .badge-paid { background: rgba(31, 157, 99, 0.12); color: var(--verified); }
    .badge-debit { background: var(--bg); color: var(--muted); font-weight: 500; }

    .page-title { font-family: "Sora", sans-serif; font-weight: 700; font-size: 1.35rem; margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }

    const LAUNCH_BILLS = [

    const SLOGAN = "Pay today. Earn tomorrow.";

    function apiErrorMessage(err) {
      const m = (err && err.message) || "";
      if (err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(m)) {
        return "Cannot reach the server. On your phone use http://YOUR-PC-WIFI-IP:8000 (same Wi‑Fi as this PC).";
      }
      if (m === "Not logged in") return m;
      return m || "Something went wrong";
    }

    async function api(path, opts = {}) {
      let res;
      try {
        res = await fetch(path, {
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
          ...opts,
        });
      } catch (err) {
        throw new Error(apiErrorMessage(err));
      }
      if (!res.ok) {
        if (res.status === 401) throw new Error("Not logged in");
        let detail = res.statusText;
        try { detail = (await res.text()) || detail; } catch { /* ignore */ }
        throw new Error(detail || res.statusText);
      }
      return res.json();

      { name: "Black", at: 48 },

    function streakOffset(months) {
      const p = Math.min(1, Math.max(0, Number(months) || 0) / STREAK_MAX);
      return (STREAK_C * (1 - p)).toFixed(2);

    function streakDotsHtml(months) {
      const next = STREAK_STOPS.find((s) => months < s.at);
      return STREAK_STOPS.map((s) => {
        const reached = months >= s.at;

        const label = reached
          ? `${s.name} ✓`

            : s.name;
        return `<span class="streak-dot-item${reached ? " reached" : ""}"><i class="streak-pip" aria-hidden="true"></i>${escapeHtml(label)}</span>`;
      }).join('<span class="streak-sep">·</span>');

    function countEase(el, from, to, ms, delay) {
      if (!el) return;
      const startAt = performance.now() + (delay || 0);
      const dur = ms;
      function frame(t) {
        if (t < startAt) { requestAnimationFrame(frame); return; }
        const p = Math.min(1, (t - startAt) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        const v = Math.round(from + (to - from) * eased);
        el.textContent = el.classList.contains("mem-points") || el.hasAttribute("data-pts") ? fmtPts(v) : String(v);
        if (p < 1) requestAnimationFrame(frame);
        else el.textContent = el.classList.contains("mem-points") || el.hasAttribute("data-pts") ? fmtPts(to) : String(to);
      }
      requestAnimationFrame(frame);
    }

      const ptsEl = home.querySelector(".card-face-front .mem-points");
      if (ptsEl) ptsEl.textContent = fmtPts(0);
      if (prefersReduced()) {

        displayPoints = pts;

      if (streakEl) countEase(streakEl, 0, streakTo, 600, 0);

        home.classList.remove("home-intro");

      const el = document.getElementById("streakMoment");
      const line = document.getElementById("streakMomentLine");

      if (!el || !line) { if (done) done(); return; }
      line.textContent = months + " months on time";

      if (burst && !prefersReduced()) {
        for (let i = 0; i < 16; i++) {

          p.style.setProperty("--d", (Math.random() * 180).toFixed(0) + "ms");

        displayPoints = to;

      if (!nodes.length) { displayPoints = to; return; }

      function frame(t) {
        const p = Math.min(1, (t - start) / dur);
        const v = Math.round(from + (to - from) * p);

    function showTab(name) {
      closeSheet();
      if (name !== "record") recordMode = "record";
      const next = document.getElementById("screen" + (TAB_SCREENS[name] || "Home"));
      const cur = [...document.querySelectorAll("#appView .screen")].find((el) => !el.classList.contains("hidden") && el !== next);
      document.querySelectorAll("#tabNav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
      if (name === "record") loadForecast().catch(() => {});
      if (!next || next === cur) {
        if (next) next.classList.remove("hidden");
        return;
      }
      const others = Object.values(TAB_SCREENS).map(s => document.getElementById("screen" + s)).filter(el => el && el !== next && el !== cur);
      others.forEach(el => { el.classList.add("hidden"); el.classList.remove("tab-enter", "tab-leave", "tab-leave-active"); });
      if (!cur || prefersReduced()) {
        if (cur) cur.classList.add("hidden");
        next.classList.remove("hidden", "tab-enter", "tab-leave", "tab-leave-active");
        return;
      }
      next.classList.remove("hidden");
      next.classList.add("tab-enter");
      cur.classList.add("tab-leave");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          next.classList.remove("tab-enter");
          cur.classList.add("tab-leave-active");
        });
      });
      setTimeout(() => {
        cur.classList.add("hidden");
        cur.classList.remove("tab-leave", "tab-leave-active");
      }, 150);
    }

    function closeSheet() {
      document.getElementById("sheet").classList.remove("open");
      document.getElementById("sheetBackdrop").classList.remove("open");
      document.getElementById("sheetBody").innerHTML = "";
    }

    async function withBusy(fn, opts = {}) {
      if (busy) return;
      busy = true;
      document.getElementById("appView").classList.add("busy");
      try {
        await fn();
      } catch (e) {
        if (opts.toast !== false) toast(apiErrorMessage(e));
        throw e;
      } finally {
        busy = false;
        document.getElementById("appView").classList.remove("busy");
      }
    }

    function openPaySheet(bill) {
      openSheet(`
        <h3>${escapeHtml(bill.pay_sheet_title)}</h3>
        ${bill.pay_sheet_detail ? `<p class="muted" style="margin-top:8px">${escapeHtml(bill.pay_sheet_detail)}</p>` : ""}
        ${bill.pay_sheet_points_line ? `<p class="row-points" style="margin-top:8px">${escapeHtml(bill.pay_sheet_points_line)}</p>` : ""}
        <div class="sheet-actions">
          <button type="button" class="btn-primary" id="confirmPay">Confirm</button>
          <button type="button" class="btn-secondary" id="cancelPay">Cancel</button>
        </div>`);
      document.getElementById("cancelPay").onclick = closeSheet;
      document.getElementById("confirmPay").onclick = () => withBusy(async () => {
        const prev = state.user.available_points;
        const prevMonths = Number(state.user.months_on_time || 0);
        const data = await api("/api/pay", { method: "POST", body: JSON.stringify({ bill_id: bill.id }) });
        closeSheet();
        const ev = data.event || {};
        if (navigator.vibrate) navigator.vibrate(12);
        afterSuccessfulPay(prevMonths, prev, data, ev.title || "Paid");
        const nextMonths = Number((data.user && data.user.months_on_time) || 0);
        if (nextMonths <= prevMonths) {
          const pts = ev.points_added || 0;
          openSheet(`
            <svg class="sheet-check" viewBox="0 0 48 48" aria-hidden="true"><path class="sheet-check-mark" d="M12 24l8 8 16-16"/></svg>
            <h3>${escapeHtml(ev.title || "Paid")}</h3>
            <p class="font-num" style="font-size:1.5rem;color:var(--verified)">${escapeHtml(ev.points_line || `+${fmtPts(pts)} points`)}</p>
            ${ev.worth_rent_line ? `<p class="row-points" style="margin-top:8px">${escapeHtml(ev.worth_rent_line)}</p>` : ""}
            <p class="muted" style="margin-top:8px">${escapeHtml(ev.new_balance_line || "")}</p>
            <div class="sheet-actions"><button type="button" class="btn-primary" id="donePay">Done</button></div>`);
          document.getElementById("donePay").onclick = closeSheet;
        }
      });
    }

    function openPayAllSheet() {
      openSheet(`
        <h3>Pay all through Woza</h3>
        <p class="muted">Rent and utilities for 1 Nov 2026</p>
        <div class="sheet-actions">
          <button type="button" class="btn-primary" id="confirmAll">Confirm</button>
          <button type="button" class="btn-secondary" id="cancelAll">Cancel</button>
        </div>`);
      document.getElementById("cancelAll").onclick = closeSheet;
      document.getElementById("confirmAll").onclick = () => withBusy(async () => {
        const prev = state.user.available_points;
        const prevMonths = Number(state.user.months_on_time || 0);
        const data = await api("/api/pay_all", { method: "POST", body: JSON.stringify({}) });
        closeSheet();
        afterSuccessfulPay(prevMonths, prev, data, "All Woza bills paid");
      });
    }

    function openResetSheet() {
      openSheet(`
        <h3>Reset demo?</h3>
        <p class="muted">Restores starting balances and due bills. You stay signed in.</p>
        <div class="sheet-actions">
          <button type="button" class="btn-primary" id="confirmReset">Reset demo</button>
          <button type="button" class="btn-secondary" id="cancelReset">Cancel</button>
        </div>`);
      document.getElementById("cancelReset").onclick = closeSheet;
      document.getElementById("confirmReset").onclick = () => withBusy(async () => {
        let savedName = "";
        try { savedName = sessionStorage.getItem("woza.displayName") || ""; } catch { /* ignore */ }
        savedName = savedName || (state && state.user && state.user.name) || "";
        state = await api("/api/reset", { method: "POST", body: JSON.stringify({ name: savedName }) });
        forecastState = null;
        lenderState = null;
        recordMode = "record";
        rewardsTab = "redeem";
        armHomeIntro();
        try { sessionStorage.removeItem("woza.flipHint"); } catch { /* ignore */ }
        closeSheet();
        renderAll();
        toast("Demo reset");
      });
    }

    function lastDisplayName() {
      try { return sessionStorage.getItem("woza.displayName") || ""; } catch { return ""; }
    }

    function renderLoginHint() {
      const wrap = document.getElementById("nameHint");
      if (!wrap) return;
      wrap.replaceChildren();
      const last = lastDisplayName();
      if (last && last.toLowerCase() !== "thandi") {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "name-chip";
        btn.id = "useLastName";
        btn.textContent = "Use " + last;
        btn.onclick = () => {
          const input = document.getElementById("displayName");
          input.value = last;
          input.focus();
        };
        wrap.appendChild(btn);
      }
    }

    async function signOut() {
      closeSheet();
      try { await api("/api/logout", { method: "POST", body: "{}" }); } catch { /* still leave */ }
      state = null;
      forecastState = null;
      lenderState = null;
      recordMode = "record";
      displayPointsInitialized = false;
      rewardsTab = "redeem";
      homeIntroPlayed = false;
      document.getElementById("appView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");
      document.getElementById("displayName").value = "";
      document.getElementById("loginErr").textContent = "";
      renderLoginHint();
      goHomeImmediate();
      document.getElementById("displayName").focus();
    }

    async function login(name) {
      const n = (name || "").trim();
      if (!n) throw new Error("Enter your name");
      try { sessionStorage.setItem("woza.displayName", n); } catch { /* ignore */ }
      await api("/api/login", { method: "POST", body: JSON.stringify({ name: n }) });
      state = await api("/api/me");
      armHomeIntro();
      goHomeImmediate();
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("appView").classList.remove("hidden");
      renderAll();
    }

    document.getElementById("sheetBackdrop").onclick = closeSheet;
    document.getElementById("tabNav").addEventListener("click", e => {
      const btn = e.target.closest("button[data-tab]");
      if (btn) showTab(btn.dataset.tab);
    });
    async function submitLogin(name) {
      document.getElementById("loginErr").textContent = "";
      try {
        await withBusy(() => login(name), { toast: false });
      } catch (e) {
        document.getElementById("loginErr").textContent = apiErrorMessage(e);
      }
    }
    document.getElementById("tryThandiBtn").onclick = () => submitLogin("Thandi");
    document.getElementById("loginBtn").onclick = () =>
      submitLogin(document.getElementById("displayName").value);
    document.getElementById("displayName").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    async function boot() {
      const bootEl = document.getElementById("bootStatus");
      bootEl.style.display = "block";
      try {
        state = await api("/api/me");
        goHomeImmediate();
        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("appView").classList.remove("hidden");
        renderAll();
      } catch {
        renderLoginHint();
      }
      finally { bootEl.style.display = "none"; }
    }
    function useServiceWorker() {
      const h = location.hostname;
      if (h === "localhost" || h === "127.0.0.1") return false;
      if (/^192\.168\.\d{1,3}\.\d{1,3}$/.test(h)) return false;
      if (/^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(h)) return false;
      if (/^172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}$/.test(h)) return false;
      return true;
    }
    if ("serviceWorker" in navigator) {
      if (useServiceWorker()) {
        navigator.serviceWorker.register("/static/sw.js?v=30").catch(() => {});
      } else {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
      }
    }
    (function bindTaps() {
      const sel = "button, .group-row, .linked-row, .tab";
      document.addEventListener("pointerdown", (e) => {
        if (prefersReduced()) return;
        const el = e.target.closest(sel);
        if (!el || el.closest("[data-card-flip]")) return;
        el.classList.add("tap-press", "is-press");
        el.classList.remove("is-release");
        if (el.classList.contains("btn-primary")) {
          const r = el.getBoundingClientRect();
          const span = document.createElement("span");
          span.className = "btn-ripple";
          span.style.left = (e.clientX - r.left) + "px";
          span.style.top = (e.clientY - r.top) + "px";
          el.appendChild(span);
          setTimeout(() => span.remove(), 480);
        }
      });
      const up = () => {
        document.querySelectorAll(".is-press").forEach((el) => {
          el.classList.remove("is-press");
          el.classList.add("is-release");
          setTimeout(() => el.classList.remove("is-release"), 280);
        });
      };
      document.addEventListener("pointerup", up);
      document.addEventListener("pointercancel", up);
    })();
    renderLoginHint();
    boot();
  </script>
</body>
</html>
